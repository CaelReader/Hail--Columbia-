l_korean:
 concept_usfp_westward_expansion: "서부 확장"
 concept_usfp_westward_expansion_desc: "미합중국이 [GetGeographicRegion('geographic_region_american_west_zone').GetName]의 [Concept('concept_state', '$concept_states|q$')]들을 장악함에 따라, 새로 편입된 주들에는 미국 [concept_primary_cultures]의 새로운 [Concept('concept_homeland', '$concept_homelands|q$')]이 점진적으로 추가될 것입니다. 본토 지위를 얻으려면 후보 주는 다음 조건을 충족해야 합니다.\n\n• [concept_split_state]가 아닐 것\n• [Concept('concept_pop', '$concept_population|q$')]이 60,000보다 많을 것\n• [Concept('concept_pop', '$concept_population|q$')] 중 정령신앙 신앙을 가진 비율이 30% 미만일 것\n• 최소 하나의 [concept_pop]이 미국 [concept_primary_cultures] 중 하나와 [Concept('concept_discrimination_trait_group','$concept_discrimination_trait_group_short|q$')]을 공유할 것"
 concept_usfp_washington_precedent: "워싱턴의 선례"
 concept_usfp_washington_precedent_desc: "조지 워싱턴의 선례에 따라 합중국의 [Concept('concept_ruler','$RULER_TITLE_PRESIDENT|q$')]은 세 번째 임기에 도전하지 않을 것입니다. 두 번째 임기를 마친 [Concept('concept_ruler','$RULER_TITLE_PRESIDENT|q$')]은(는) 새로운 후보가 대통령 후보자로 출마할 수 있도록 [concept_interest_group] [concept_leader]의 자리에서 물러날 것입니다."
 USFP_TRIGGER_MANIFEST_DESTINY_PRO_EXPANSION: "[CHARACTER.GetFullName]은(는) #tooltippable;tooltip:[Character.GetTooltipTag],usfp_manifest_destiny_special_tooltip_pro_expansion 팽창주의자#!입니다"
 USFP_TRIGGER_MANIFEST_DESTINY_PRO_EXPANSION_NOT: "[CHARACTER.GetFullName]은(는) #tooltippable;tooltip:[Character.GetTooltipTag],usfp_manifest_destiny_special_tooltip_pro_expansion 팽창주의자#!가 #b 아닙니다#!"
 USFP_TRIGGER_MANIFEST_DESTINY_PRO_EXPANSION_OR_BIGOTED: "[CHARACTER.GetFullName]은(는) #tooltippable;tooltip:[Character.GetTooltipTag],usfp_manifest_destiny_special_tooltip_pro_expansion 팽창주의자#!거나 혹은 [GetCharacterTrait('bigoted').GetName] [concept_character_trait]을 가집니다"
 USFP_TRIGGER_MANIFEST_DESTINY_PRO_EXPANSION_OR_BIGOTED_NOT: "[CHARACTER.GetFullName]은(는) #tooltippable;tooltip:[Character.GetTooltipTag],usfp_manifest_destiny_special_tooltip_pro_expansion 팽창주의자#!가 #b 아니#!며 동시에 [GetCharacterTrait('bigoted').GetName] [concept_character_trait]을 갖지 않습니다"
 USFP_TRIGGER_MANIFEST_DESTINY_ANTI_EXPANSION: "[CHARACTER.GetFullName]은(는) #tooltippable;tooltip:[Character.GetTooltipTag],usfp_manifest_destiny_special_tooltip_anti_expansion 반팽창주의자#!입니다"
 USFP_TRIGGER_MANIFEST_DESTINY_ANTI_EXPANSION_NOT: "[CHARACTER.GetFullName]은(는) #tooltippable;tooltip:[Character.GetTooltipTag],usfp_manifest_destiny_special_tooltip_anti_expansion 반팽창주의자#!가 #b 아닙니다#!"
 USFP_MANIFEST_DESTINY_HIGH_ENOUGH: "#bold 명백한 운명#!충분한 영향력($VALUE|0$ 이상)을 가집니다"
 USFP_MANIFEST_DESTINY_HIGH_ENOUGH_NOT: "#bold 명백한 운명#! 충분한 영향력($VALUE|0$ 이상)을 가지고 있지 #b 않습니다#!"
 USFP_MANIFEST_DESTINY_LOWER_THAN: "#bold 명백한 운명#! 영향력이 충분히 낮습니다($VALUE|0$ 이하)."
 USFP_MANIFEST_DESTINY_LOWER_THAN_NOT: "#bold 명백한 운명#! 영향력이 충분히 낮지 #b 않습니다#!($VALUE|0$ 이하)."
 USFP_TRIGGER_AFRO_AMERICAN_IS_DISCRIMINATED: "[COUNTRY.GetName]은(는) [GetLawType('law_cultural_exclusion').GetName] 또는 [GetLawType('law_multicultural').GetName] 법을 시행하지 #b 않았습니다#!"
 USFP_TRIGGER_AFRO_AMERICAN_IS_DISCRIMINATED_NOT: "[COUNTRY.GetName]은(는) [GetLawType('law_cultural_exclusion').GetName] 또는 [GetLawType('law_multicultural').GetName] 법을 시행하고 있습니다"
 glossary_usfp_house_of_representatives: "하원"
 glossary_usfp_house_of_representatives_desc: "하원은 미국 [glossary_usfp_congress]의 양원 중 하원에 해당하는 입법 기관입니다. 빅토리아 시대에는 국가의 성장에 따른 인구 증가를 비례적으로 반영하기 위해 투표권을 가진 하원의원의 수가 점차 늘어났습니다.\n\n하원의 고유 권한에는 모든 세입 법안의 발의, 연방 공직자에 대한 탄핵 소추, 그리고 선거인단 투표에서 과반수를 얻은 대통령 후보가 없을 경우 대통령을 선출하는 권한이 포함됩니다."
 glossary_usfp_senate: "상원"
 glossary_usfp_senate_desc: "상원은 미국 [glossary_usfp_congress]의 양원 중 상원에 해당하는 입법 기관입니다. 상원 의석은 연방에 속한 각 주마다 2석씩 배정되며, 인구에 비례하여 의석이 배분되는 [glossary_usfp_house_of_representatives]와 달리 인구가 적은 주들의 영향력을 강화하는 역할을 합니다. 노예제가 국가의 핵심 쟁점으로 떠오르면서 자유주와 노예주 사이에 새로운 상원 의석을 어떻게 배분할 것인지가 중요한 문제로 부상했습니다. 양측 모두 상대편이 과반수 의석을 차지하는 것을 원하지 않았기 때문입니다.\n\n상원은 미국 대통령이 고위 공직에 지명한 인사의 임명을 인준하고, 조약을 승인하거나 거부하며, 하원이 소추한 탄핵 사건을 심판하는 고유 권한을 가지고 있습니다."
 glossary_usfp_congress: "의회"
 glossary_usfp_congress_desc: "미국 연방의회는 미국 연방정부의 입법 기관입니다. 양원제로 구성되어 있으며, 하원인 [glossary_usfp_house_of_representatives]와 상원인 [glossary_usfp_senate]으로 이루어져 있습니다. 하원과 상원은 입법 과정에서 동등한 권한을 가지며, 양원 모두의 동의 없이는 어떠한 법률도 제정될 수 없습니다."
 glossary_usfp_nullification_crisis: "연방법실시거부 위기"
 glossary_usfp_nullification_crisis_desc: "연방법실시거부 위기는 합중국 내의 부분적 정치 위기로 사우스 캐롤라이나 주 정부와 연방 정부 사이에 벌어진 갈등입니다. 사우스 캐롤라이나가 1828년과 1832년의 연방 관세법이 위헌이며 주의 주권적 경계 내에서 적용되지 않는다고 선포하면서 사건이 촉발되었습니다. 워싱턴에서도 대통령 잭슨과, 사우스 캐롤라이나 출신이자 연방법 무효화 이론을 옹호하는 가장 중요한 인물인 부통령 존 캘드웰 캘훈 사이에서 공개적인 분열이 일어났습니다.\n\n사우스 캐롤라이나는 연방측의 관세 강행 가능성에 저항하기 위해 군사적 준비를 개시했지만, 1833년 3월 의회에서 강제 시행법(대통령에게 사우스 캐롤라이나에 대한 군사력 사용을 허가한 법안)과 사우스 캐롤라이나 측에서도 만족할만한 수준의 새로이 협상된 관세법을 통과시켰습니다. 사우스 캐롤라이나 특별 의회가 재소집되었고 관세법 무효화 결정을 철회했습니다. 하지만 3일 후에, 원칙에 대한 상징적 행보로서 강제 시행법을 무효화했습니다.\n\n위기는 끝났고, 양측 모두에게 승리라고 주장할만한 이유가 있었습니다. 관세율은 줄어들었고 남부를 만족시킬만큼 낮은 수준으로 유지되었지만, 각 주의 권리에 기반한 연방법 무효화 권리는 논쟁거리로 남았습니다. 그리고 노예제가 미국 정치의 중요한 사안으로 떠오르면서 이 논쟁은 점점 더 첨예해졌습니다. "
 glossary_usfp_louisiana_purchase: "루이지애나 매입"
 glossary_usfp_louisiana_purchase_desc: "루이지애나 매입은 1803년 합중국이 프랑스 제1공화국으로부터 루이지애나 준주를 획득한 사건을 의미합니다. 해당 매입에는 미시시피강 서안의 배수 지역의 대부분이 포함되어 있습니다. 대략 1평방마일당 18달러에 해당하는 천 오백만 달러를 대가로 지불한 합중국은 훗날 미국 중부를 이루게 되는 총 828,000 평방마일의 영토를 명목상으로 확보했습니다. 서류상으로 합중국의 규모는 거의 두배로 확대되었습니다.\n\n그러나 해당 지역에서 프랑스가 통제했던 범위는 극히 일부에 불과하였고, 대부분에는 아메리카 원주민이 거주하고 있었습니다. 사실상 합중국은 지역 대부분에 있어서 여타 식민열강의 개입을 배제한 채로 조약 혹은 정복을 통해 인디언의 영토를 획득할 수 있는 선점적 권리를 구매했던 것입니다. 이 영토에 대한 실질적 통제력을 둘러싼 투쟁은 1900년대까지도 지속될 것입니다."
 glossary_usfp_trusts: "트러스트"
 glossary_usfp_trusts_desc: "트러스트는 단일 기업 형태일수도 있고 여러 기업이 다양한 방법을 통해 협력하는 형태일 수도 있는, 강력한 시장 지배력을 갖춘 거대한 기업 집단입니다. 그러한 회사 트러스트가 처음에는 대기업의 조직력을 강화하기 위해 수립되었지만, 곧 시장 독점을 구축하고 유지하기 위한 반경쟁적 사업 관행에 나서려고 그들의 시장 지배력을 남용한다는 광범위한 비난에 직면하게 되었습니다. 그러한 비난으로 인해 트러스트라는 용어는 미국 대중 사이에서 독점적 사업 관행과 강력하게 연관되게 되었고, 최초의 미국 연방 경쟁 법령인 1890년의 셔먼 트러스트 금지법의 제정까지 이어졌습니다.\n\n역사적으로 중요한 트러스트에는 스탠더드 오일, U.S. 스틸, 아메리칸 토바코 컴퍼니 등이 포함됩니다."
 glossary_usfp_political_machines: "파벌 조직"
 glossary_usfp_political_machine: "파벌 조직"
 glossary_usfp_political_machines_desc: "정치 기구는 금전이나 공직과 같은 실질적인 보상을 제공하여 구성원을 모집하고, 지도부가 구성원의 활동을 강력하게 통제하는 정당 조직입니다. 이러한 요소는 대부분의 정당과 정치 조직에서 흔히 나타나지만, 정치 기구에서는 필수적인 특징으로 자리 잡고 있습니다. 정치 기구는 위계질서와 보상을 통해 정치적 권력을 유지하며, 이를 위해 강력한 당내 기율 체계를 활용하는 경우가 많습니다. 정치 기구에는 때때로 정치 보스라고 불리는 실력자가 존재하며, 대체로 정치적 후원 관계와 엽관제, 막후 통제, 대의민주주의 체제 내에서 오랫동안 형성된 정치적 유대 관계에 의존합니다.\n\n정치 기구는 지역 기업인과 선출직 공직자, 그리고 이들이 임명한 인사들의 충성을 확보하고, 원하는 결과를 얻기 위해 누구에게 영향력을 행사해야 하는지 잘 아는 '보스'를 정점으로 하는 위계적인 조직을 통해 지역 정치를 장악합니다. 이러한 정치적 통제 체계는 특히 도금 시대에 두드러지게 나타났습니다. 강력한 권력을 가진 한 인물인 보스를 중심으로 여러 하위 인물들이 복잡한 조직인 정치 기구를 형성했으며, 이들은 경제적·사회적 사익을 추구하는 과정에서 상호 이익을 주고받으며 결속했습니다.\n\n이러한 정치 기구 가운데 가장 악명 높았던 조직 중 하나는 민주당의 정치 기구인 태머니 홀입니다. 태머니 홀은 1790년대부터 1960년대까지 뉴욕시와 뉴욕주 정치에 막대한 영향력을 행사했으며, 특히 아일랜드계 이민자들이 미국 정치계에서 입지를 다지는 데 중요한 역할을 했습니다. 1872년부터 태머니 홀은 아일랜드계 '보스'의 지배를 받았습니다. 그러나 태머니 홀은 동시에 부정축재와 정치적 부패의 온상이기도 했으며, 특히 19세기 중반 윌리엄 M. '보스' 트위드가 이끌던 시기의 부패 행위가 가장 악명 높았습니다."
 glossary_usfp_muckrakers: "추문 폭로자"
 glossary_usfp_muckraker: "추문 폭로자"
 glossary_usfp_muckrakers_desc: "추문 폭로 기자들은 진보주의 시대에 활동한 개혁 지향적인 언론인, 작가, 사진가들의 집단으로, 주로 선정적인 출판물을 통해 기성 제도의 부패와 비리를 폭로하고자 했습니다. 특히 출판업자 S. S. 맥클루어가 발행한 《맥클루어스 매거진》을 비롯한 추문 폭로 잡지들은 기업의 독점과 [glossary_usfp_political_machines]를 비판하는 한편, 도시 빈곤과 위험한 노동 환경, 매춘, 아동 노동 문제에 대한 대중의 인식을 높이고 분노를 불러일으키고자 했습니다. 추문 폭로 기자들은 대부분 논픽션을 집필했지만, 업턴 싱클레어의 작품처럼 허구의 이야기를 통해 사회 문제를 폭로한 소설들도 종종 막대한 영향을 미쳤습니다.\n\n객관적인 사실 전달을 중시하는 보도 방식과 달리, 추문 폭로 기자들은 스스로를 무엇보다 사회 개혁가로 여겼으며 정치 활동에도 적극적으로 참여했습니다. 이들은 과거 '황색 언론'의 탐사 보도와 선정주의적 전통을 계승하면서도, 사회를 변화시키겠다는 목적을 가지고 글을 썼습니다. 이들의 활동이 대중의 관심을 끌고 널리 알려지면서 잡지의 발행 부수가 증가했고, 그 결과 추문 폭로 기자들의 작품은 광범위한 독자층에 도달할 수 있었습니다.\n\n역사적으로 유명한 추문 폭로 기자로는 아이다 M. 타벨, 업턴 싱클레어, 링컨 스테펀스 등이 있습니다."
 glossary_usfp_popular_sovereignty: "국민 주권"
 glossary_usfp_popular_sovereignty_desc: "내전으로 향해 가던 1850년대, 미시간 주 상원의원 루이스 캐스와 일리노이주 상원의원 스티븐 아널드 더글라스가 지휘하는 북부 민주당에서 노예제 사안에 대한 중도적 입장으로서 인민주권 개념을 제안했습니다. 이 개념은 특정 영토의 실거주민들이 해당 지역에서 노예제가 허용될지 말지에 대해 투표를 통해 결정할 수 있어야 한다는 주장입니다. 연방정부가 결정을 내릴 필요가 없도록, 민주주의에 호소함으로써, 캐스와 더글라스는 노예제에 대한 찬반 논쟁을 교묘하게 처리할 수 있기를 희망했습니다. 1854년 의회를 통과한 캔자스-네브래스카 법안에서 더글라스는 캔자스에 인민주권을 적용했습니다.\n\n그 법안은 두 가지 예상치 못한 결과를 가져왔습니다. 1820년 미주리 타협에 따라 캔자스에서는 노예제가 허가되어서는 안됐으나, 이를 파기하는 법안이 통과되면서 노예제 팽창에 날개를 달아준 격이 되었습니다. 하룻밤 사이에, 북부 전역의 반노예제 세력이 분노하여 \"반-네브래스카\" 운동으로 결집하였고, 이는 곧 노예제 확장을 막겠다는 확고한 의견을 견지하는 공화당 결성으로 이어졌습니다."
 glossary_usfp_supreme_court: "대법원"
 glossary_usfp_supreme_court_desc: "미합중국 연방 대법원(SCOTUS)는 합중국 연방 사법 체계의 최고 법원입니다. 이곳은 미국 연방 법원의 모든 사안, 그리고 미국 헌법 혹은 연방법에 대한 문제가 포함된 주 법원 사안에 대한 최종 심판권을 가집니다. 1803년, 사법부는 헌법 조항을 위반하는 법령을 무효화할 수 있는 능력인 사법심사권을 스스로 확립했습니다. 또한 헌법 혹은 제정법에 위반되는 대통령의 지시를 폐지할 수도 있습니다.\n\n대법관직은 종신직이며, 사망, 은퇴, 사임 혹은 탄핵당하거나 면직되지 않는 한 자리를 유지합니다. 결원이 발생할 경우, 상원의 조언과 동의 하에서 대통령이 새로운 대법관을 임명하며, 이런 방식을 통해 대통령 행정부가 미래에 있을 판결에 대해 상당한 수준의 영향력을 행사할 수 있습니다."
 glossary_usfp_jim_crow: "짐 크로우"
 glossary_usfp_jim_crow_desc: "짐 크로우 법은 19세기 후반부터 20세기 초까지 합중국 남부 지역에서 인종 분리를 강제하기 위해 도입된 주 및 지역 법률로, \"짐 크로우\"는 아프리카계 미국인에 대한 멸칭입니다. 실제로, 짐 크로우 법은 과거 미연합국의 구성했던 주를 비롯한 인근 지역에서 1870년대부터 모든 공공시설에서의 인종 분리를 명령했습니다.\n\n이론적으로는 \"분리하되 평등\"을 지향했지만, 아프리카계 미국인을 위한 시설은 백인 미국인을 위한 시설에 비교해서 일관되게 열등했으며 자금도 덜 투입되었습니다. 때로는 흑인 공동체를 위한 시설이 아예 존재하지 않을 때도 있었습니다. 평등과는 거리가 먼 법제도였던 짐 크로우는 경제적, 교육적, 정치적 그리고 사회적 불이익을 제도화했고 합중국에서 거주하는 대부분의 아프리카계 비국인에게 2등시민 지위를 부여했습니다."
 glossary_usfp_thirteen_colonies: "13개 식민지"
 glossary_usfp_thirteen_colonies_desc: "13개 식민지는 북아메리카의 대서양 연안에 위치했던 영국 식민지들을 통칭하는 표현입니다. 그들은 훗날 미국 혁명 전쟁과 함께 영국 왕실로부터 분리되어 미합중국을 형성하는데 가담했습니다.\n\n13개 식민지는 일정한 수준의 자치와 실질적인 지역 선거를 실시하고 있었고, 더 많은 통제력을 행사하려는 런던의 의도에 저항했습니다. 프랑스 그리고 인디언 동맹과 맞서 싸웠던 프렌치-인디언 전쟁은 영국과 13개 식민지 사이의 긴장을 강화시켰습니다. 1750년대 동안, 식민지들은 영국과 직접 소통하는 대신 서로 협력하기 시작했습니다. 식민지의 인쇄업자와 신문의 도움에 힘입어 식민지간 활동과 관심사가 공유되었고, \"대표 없이 과세 없다\"는 구호로 대표되는, 식민지인의 \"영국인과 같은 수준의 권리\"를 요구하는데까지 이어졌습니다.\n\n18세기 후반 세금과 권리를 둘러싼 영국 정부와의 충돌은 미국 혁명으로 이어졌습니다. 거기서 13개 식민지는 처음으로 대륙회의를 구성하는데 참여했고 대륙군을 조직하였으며, 1776년에는 독립을 선언했습니다."
 glossary_usfp_monroe_doctrine: "먼로 독트린"
 glossary_usfp_monroe_doctrine_desc: "먼로 독트린은 서반구에서 유럽 열강의 식민주의에 반대하는 미국의 외교 정책입니다. 이 원칙에 따르면 외국 열강이 아메리카 대륙의 정치 문제에 개입하는 행위는 미국에 대한 잠재적인 적대 행위로 간주됩니다. 제임스 먼로 대통령은 의회에서 행한 제7차 연례 국정연설을 통해 이 원칙을 처음으로 천명했습니다.\n\n당시 아메리카 대륙에 존재하던 스페인의 식민지들은 거의 모두 독립을 달성했거나 독립을 눈앞에 두고 있었습니다. 먼로는 신세계와 구세계가 명확히 구분된 별개의 세력권으로 남아야 한다고 주장했으며, 이에 따라 유럽 열강이 아메리카 대륙의 주권국가들을 추가로 지배하거나 영향력을 행사하려는 시도는 미국의 안보에 대한 위협으로 간주될 것이라고 선언했습니다. 그 대신 미국은 기존 유럽 열강의 식민지를 인정하고 이에 간섭하지 않으며, 유럽 국가들의 내정에도 개입하지 않을 것이라고 밝혔습니다."