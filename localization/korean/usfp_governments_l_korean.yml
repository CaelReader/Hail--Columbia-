l_korean:
 gov_usfp_federal_republic_presidential:0 "연방 공화국"
 gov_usfp_federal_republic_presidential_desc:2 "이것은 [concept_head_of_state]측이 [Concept('concept_election','$concept_elected|q$')] [Concept('concept_ruler','$RULER_TITLE_PRESIDENT|q$')]이며, [Concept('concept_election','$concept_elected|q$')] 의회와 개별 주정부에 상당한 권력을 위임하는 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_principal_chiefdom:0 "부족정"
 gov_usfp_principal_chiefdom_desc:3 "이것은 [concept_country]이(가) [Concept('concept_ruler','$RULER_TITLE_PRINCIPAL_CHIEF|q$')]에 의해 지도되는 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_tribal_confederation: "부족 연합정"
 gov_usfp_tribal_confederation_desc: "이것은 동맹에 속한 여러 민족들로 이루어진 [concept_government_type]입니다. 각 구성 민족은 대부분 자치적이지만 전체 연합에 영향을 끼칠 결정을 내릴 때 부족 지도자 협의회를 소집합니다. [Concept('concept_ruler','$RULER_CHIEFTAIN|q$')]은 필요할 시 #italic 사실상#! [concept_head_of_state]으로서 활동할 수 있습니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_tribal_confederation_centralized: "국가연합"
 gov_usfp_tribal_confederation_centralized_desc: "이것은 [Concept('concept_ruler','$RULER_TITLE_PRINCIPAL_CHIEF|q$')] 지도력 아래의 동맹으로 연합된 여러 국가들이 구성한 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_theodemocracy: "신정-민주정"
 gov_usfp_theodemocracy_desc: "민주주의 전통과 예수 그리스도 후기 성도 교회의 계서제를 결합한 [concept_government_type]입니다. 대통령의 정원회는 [concept_head_of_state]의 역할을 수행하는 [Concept('concept_ruler','$RULER_TITLE_PRESIDENT|q$')]가 지도합니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_federal_territory: "연합 준주"
 gov_usfp_federal_territory_desc: "이것은 미합중국 연방정부가 통제하며 임명된 [Concept('concept_ruler','$RULER_TITLE_GOVERNOR|q$')]이(가) 통치하는 준주입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_congressional_republic: "의회 공화국"
 gov_usfp_congressional_republic_desc: "이것은 [Concept('concept_ruler','$RULER_TITLE_SPEAKER_OF_THE_HOUSE|q$')]이 지휘하는 [Concept('concept_election','$concept_elected|q$')]에 의해 통치받는 [concept_government_type]입니다. 명목상으로는 [Concept('concept_election','$concept_elected|q$')] [Concept('concept_ruler','$RULER_TITLE_PRESIDENT|q$')]가 존재하지만, 정부 내에서 실질적 권력을 가지지는 않습니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_TITLE_SPEAKER_OF_THE_HOUSE: "국회의장"
 gov_usfp_syndicalist_federation: "생디칼리스트 대회"
 gov_usfp_syndicalist_federation_desc: "이는 노동자들이 직접 [Concept('concept_election','$concept_elected|q$')]한 전산업평의회가 [concept_country]를 통치하는 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_syndicalist_federation_anarchist: "생디칼리슴 연합"
 gov_usfp_syndicalist_federation_anarchist_desc: "이는 노동조합 조직들이 기존 국가 기구를 대체하고, 지역 사업장 위원회에서 선출한 대표들로 구성된 지역 및 전국 평의회를 설립하여 통치하는 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 RULER_TITLE_DELEGATE: "대표"
 gov_usfp_private_colony: "사립 식민지"
 gov_usfp_private_colony_desc: "이것은 아프리카에 해방 노예들의 공화국을 설립하려는 목적으로 미국 식민 협회에 의해 세워졌던 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_council_federation: "협의회 연합"
 gov_usfp_council_federation_desc: "이는 노동자 대표들이 직접 [Concept('concept_election','$concept_elected|q$')]한 의회가 [concept_country]를 통치하며, 지방 및 지역 평의회에 상당한 권한이 부여되는 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_usfp_industrial_council: "산업위원회"
 gov_usfp_industrial_council_desc: "이는 산업 노동군을 지휘하는 기술 전문가들로 구성된 위원회가 임명한 [Concept('concept_ruler','$RULER_TITLE_PRESIDENT|q$')]이(가) [concept_head_of_state]을(를) 맡는 [concept_government_type]입니다.\n\n$TRANSFER_OF_POWER_NAME_DESC$"